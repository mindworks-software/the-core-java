build-docker-gradle-core-java:
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        VERSION: $CI_COMMIT_TAG
  stage: package
  tags:
    - Runner-01
  image: docker:19.03.1
  dependencies:
    - build-app-gradle
  services:
    - docker:19.03.1-dind
  before_script:
    - docker login -u "$DOCKER_REGISTRY_USER" -p "$DOCKER_REGISTRY_PASS" "$DOCK_REGISTRY"
  needs:
     - job: build-app-gradle
       artifacts: true
  script:
    - docker build --build-arg APP_ZIP="./router/build/distributions/thecore-router-$VERSION.zip" --build-arg APP_NAME="thecore-router-$VERSION" -f Dockerfile-jdk8-service -t thecore-router:$VERSION-${CI_COMMIT_SHA:0:7} .
    - docker tag thecore-router:$VERSION-${CI_COMMIT_SHA:0:7} "$DOCK_REGISTRY_PATH/thecore-router:$VERSION-${CI_COMMIT_SHA:0:7}"
    - docker push "$DOCK_REGISTRY_PATH/thecore-router:$VERSION-${CI_COMMIT_SHA:0:7}"
    - docker tag thecore-router:$VERSION-${CI_COMMIT_SHA:0:7} "$DOCK_REGISTRY_PATH/thecore-router:latest"
    - docker push "$DOCK_REGISTRY_PATH/thecore-router:latest"


