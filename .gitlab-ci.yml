image: "openjdk:11-jdk-slim"

variables:
  VERSION: 4.0.0-SNAPSHOT
  DEFAULT_JVM_OPTS: "-Djavax.net.ssl.trustStore=/etc/bigs/cacerts -Djavax.net.ssl.trustStorePassword=${BIGS_JAVA_CACERTS_PASS} -Dhttps.protocols=TLSv1.2"
  GRADLE_JVM_ARGS: "-Dorg.gradle.jvmargs=${DEFAULT_JVM_OPTS}"
  PROJECT: "novalend"
  # Chnage to client
  DOCK_REGISTRY: "docker-registry-default.paas.bayportfinance.com"
  DOCK_REGISTRY_PATH: "$DOCK_REGISTRY/$PROJECT"

stages:
  - compile
#   - test
  - build
  - package
  - startup

.default_rules: &default_rules
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_TAG
      variables:
        VERSION: "$${CI_COMMIT_REF_NAME}-$${CI_COMMIT_SHA:0:7}"
    - if: $CI_COMMIT_REF_NAME =~ /^release-.*/
      variables:
        VERSION: "$${CI_COMMIT_REF_NAME:8}-RC-$${CI_COMMIT_SHA:0:7}"
    - if: $CI_COMMIT_REF_NAME =~ /^qa\/.*/
      variables:
        VERSION: "$${CI_COMMIT_REF_NAME:3}-QA-$${CI_COMMIT_SHA:0:7}"
    - if: $CI_COMMIT_REF_PROTECTED == "true"
    - when: always


compile-app-gradle:
  <<: *default_rules
  stage: compile
  tags:
    - Runner-01

  script:
    - echo $GRADLE_JVM_ARGS
    - ./gradlew assemble testClasses $GRADLE_JVM_ARGS
  artifacts:
    name: "gradle-the-core-java-$CI_COMMIT_TAG"
    paths:
      - router/build/distributions/*.zip


build-app-gradle:
  <<: *default_rules
  stage: build
  tags:
    - Runner-01

  #image: ${DOCK_REGISTRY_PATH}/${NOVA_MCR_IMAGE}
  script:
    - ./gradlew build #$GRADLE_JVM_ARGS
  allow_failure: true
#   needs:
#      - job: test-app-gradle
  artifacts:
    name: "gradle-nova-application-$CI_COMMIT_TAG"
    paths:
      - router/build/distributions/*.zip


